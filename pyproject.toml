[project]
name = "diagram-codebase"
version = "0.1.0"
description = "Claude Code skill that turns a repository into an evidence-backed architecture model and editable FigJam diagrams."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # runtime is standard library only

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["skills/diagram-codebase/scripts", "skills/diagram-codebase/hooks"]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]
